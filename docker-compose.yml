name: csmju-intern-sync

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '3'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: intern_sync
      POSTGRES_USER: intern_sync
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-intern_sync_local}
      TZ: Asia/Bangkok
    ports: ['127.0.0.1:5434:5432']
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U intern_sync -d intern_sync']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  api:
    <<: *hardening
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: production
      PORT: '4000'
      DATABASE_URL: postgresql://intern_sync:${POSTGRES_PASSWORD:-intern_sync_local}@db:5432/intern_sync?schema=public
      DATABASE_POOL_MAX: '5'
      SUBSYSTEM_ID: csmju-intern-sync
      CORE_HUB_URL: https://csmju2030.jowave.com
      CORE_HUB_JWKS_URL: https://csmju2030.jowave.com/api/v1/.well-known/jwks.json
      CORE_HUB_WEB_URL: https://csmju2030.jowave.com
      CORE_HUB_ISSUER: core-hub
      CORE_HUB_AUDIENCE: csmju2030
      TZ: Asia/Bangkok
    tmpfs: ['/tmp:size=32m']
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    mem_limit: 512m

  web:
    <<: *hardening
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      CORE_HUB_WEB_URL: https://csmju2030.jowave.com
      SUBSYSTEM_ID: csmju-intern-sync
      TZ: Asia/Bangkok
    tmpfs: ['/tmp:size=32m', '/app/frontend/.next/cache:size=64m']
    depends_on:
      api:
        condition: service_healthy
    ports: ['127.0.0.1:3002:3000']
    mem_limit: 384m

volumes:
  db-data: